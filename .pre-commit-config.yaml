repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deploy/k8s/templates/
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: python -m ruff check src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff (format check)
        entry: python -m ruff format --check src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (strict on src/common and scripts)
        entry: python -m mypy --strict src/common scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: schemas-check
        name: schemas-check (verify JSON Schemas are up to date)
        entry: python -m scripts.export_schemas --check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (unit test suite)
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
