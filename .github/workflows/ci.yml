name: AlphaTrader CI Quality Gates

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run Ruff linter and format check
        run: make lint

      - name: Run Mypy strict static typecheck
        run: make typecheck

      - name: Run Pytest unit test suite with coverage
        run: make test

      - name: Verify CLI healthcheck entry point
        run: python -m src.common.healthcheck
