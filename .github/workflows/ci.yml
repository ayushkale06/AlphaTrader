name: AlphaTrader CI Quality Gates

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Typecheck, Schemas & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          make install

      - name: Run Ruff linter and format check
        run: make lint

      - name: Run Mypy strict static typecheck
        run: make typecheck

      - name: Verify exported JSON Schemas and docs/contracts.md are up to date
        run: make schemas-check

      - name: Run Pytest unit test suite with coverage
        run: make test

      - name: Verify CLI healthcheck entry point
        run: make healthcheck

  infrastructure-integration:
    name: Infrastructure Integration (PostgreSQL, Redis, Redpanda)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          make install

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start local Docker infrastructure
        run: make up

      - name: Wait for services to become healthy
        run: |
          timeout 120 bash -c 'until [ $(docker compose --env-file .env -f deploy/docker/docker-compose.yml ps | grep -c "(healthy)") -ge 3 ]; do sleep 2; done'
          docker compose --env-file .env -f deploy/docker/docker-compose.yml ps

      - name: Create Kafka topics from registry
        run: make topics

      - name: Run infrastructure smoke test
        run: make smoke

      - name: Run integration tests against live infrastructure
        run: make test-integration

      - name: Verify Market Data Streamer coverage gate (>= 90%)
        run: make test-streamer-coverage

      - name: Verify Technical Analyst coverage gate (>= 90%)
        run: make test-analyst-coverage

      - name: Verify Backtesting Framework coverage gate (>= 90%)
        run: make test-backtesting-coverage

      - name: Verify Risk Guardrail coverage gate (>= 90%)
        run: make test-risk-coverage

      - name: Verify Paper Execution Broker coverage gate (>= 90%)
        run: make test-broker-coverage

      - name: Tear down infrastructure
        if: always()
        run: make down
