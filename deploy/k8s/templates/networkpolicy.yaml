apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alphatrader.fullname" . }}-netpol
  labels:
    app.kubernetes.io/name: {{ include "alphatrader.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "alphatrader.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
