# Default values for alphatrader Helm chart (Production Release v1.0.0)
global:
  environment: development
  tradingMode: PAPER
  liveTradingEnabled: false

replicaCount: 1

image:
  repository: ghcr.io/ayushkale06/alphatrader
  pullPolicy: IfNotPresent
  tag: "1.0.0"

riskGuardrail:
  maxDailyDrawdownPct: 2.0
  maxPositionSizePct: 5.0
  maxOpenPositions: 10
