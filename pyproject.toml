[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphatrader"
version = "0.3.0-alpha"
description = "Autonomous multi-agent algorithmic trading and deterministic risk orchestrator for NIFTY 50 (NSE) paper trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kale" }
]
keywords = ["algorithmic-trading", "paper-trading", "nifty50", "mcp", "langgraph", "risk-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.0.0",
    "tzdata==2026.5",
    "psycopg[binary]==3.3.6",
    "redis==5.2.1",
    "confluent-kafka==2.16.0",
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.169.0",
    "pre-commit==4.7.0",
    "ta==0.11.0",
    "types-redis==4.6.0.20241004",
]

[project.scripts]
alphatrader-healthcheck = "src.common.healthcheck:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/common", "scripts", "src/mcp_servers"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src.common",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
markers = [
    "integration: marks tests as requiring local infrastructure services (PostgreSQL, Redis, Redpanda)",
    "asyncio: marks tests as asynchronous coroutines managed by pytest-asyncio",
]

[tool.coverage.run]
branch = true
source = ["src/common"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_empty = true
